pipeline:
  id: pipeline_asv108_goHelloWorldServer_build_d8f4
  name: pipeline_asv108_goHelloWorldServer_build_d8f4
  stages:
    - id: build
      name: Build
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: true
      platform:
        os: linux
        arch: amd64
      steps:
        - name: Build
          id: build_step
          run:
            shell: bash
            script: go build -v ./...
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              mkdir -p .harness/reports .harness/coverage
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go install github.com/jstemmer/go-junit-report/v2@v2.1.0
              set +e
              go test -v -coverprofile=.harness/coverage/coverage.out ./... 2>&1 | tee .harness/reports/go-test.log
              test_status=${PIPESTATUS[0]}
              "$(go env GOPATH)/bin/go-junit-report" -set-exit-code < .harness/reports/go-test.log > .harness/reports/junit.xml
              report_status=$?
              set -e
              if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
              exit "$report_status"
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/coverage.out"
              hcli cov upload --file=".harness/coverage/coverage.out"
  tags:
    onboarding: "true"
